name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the shared em-lib environment uses; 3.11 is the floor
        # pyproject declares, and testing it is what keeps that honest.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      # em-blockrun is a sibling package, not on PyPI. It is public, so no token is
      # needed — but pip would still try PyPI for the `em-blockrun` requirement, so
      # it has to be installed from source FIRST to satisfy that.
      - uses: actions/checkout@v7
        with:
          repository: flatiron-connectomics/em-blockrun
          path: .siblings/em-blockrun

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./.siblings/em-blockrun
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Smoke-test the installed console script
        # The suite runs from a source tree, so it cannot catch a packaging fault
        # that only shows up once installed — which is the whole reason this
        # package grew a CLI. Run it from a directory with no checkout in sight.
        run: |
          pip install build
          python -m build --wheel -o dist/
          pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp && em-vol --help > /dev/null && em-vol info 2>&1 | head -1 || true
          cd /tmp && python -c "
          from em_blockrun import bundled_configs, resolve_config
          assert 'dask-local' in bundled_configs(), bundled_configs()
          print('bundled dask templates resolve:', resolve_config('dask-local'))
          "

  # Ask the documentation site to rebuild, so the published CLI reference follows this
  # commit. `main` only, and only once the tests pass: the reference is generated from
  # the live parsers, so publishing from a red commit would document code nobody should
  # be running.
  docs:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild flatiron-connectomics/em-libraries
        env:
          # The workflow's own GITHUB_TOKEN is scoped to THIS repository and cannot
          # dispatch to another one, so this needs a separate token with contents:write
          # on em-libraries. When it is absent the step says so and succeeds — a docs
          # refresh that did not happen must not turn a green test run red, and the
          # site rebuilds on its nightly schedule regardless.
          TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::DOCS_DISPATCH_TOKEN is not set; skipping. The site will pick this commit up on its next scheduled build."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/flatiron-connectomics/em-libraries/dispatches \
            -d "{\"event_type\":\"package-updated\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\"}}"
          echo "::notice::asked em-libraries to rebuild its docs for $GITHUB_SHA"

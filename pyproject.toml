[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neu-vol"
version = "0.1.0"
description = "Chunked I/O, conversion, and multiscale generation for large 3D EM volumes, orchestrated with dask (local or Rusty/SLURM)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Erik Schomburg", email = "eschomburg@flatironinstitute.org" }]
# In the shared conda env these come from conda-forge, so install with
# `pip install --no-deps -e .` to keep pip from re-resolving them.
dependencies = [
    "numpy>=2",
    "neu-lib",             # BBox + grid arithmetic. numpy-only, so it adds nothing.
    "tensorstore>=0.1.70", # zarr v3 array data + neuroglancer-precomputed
    "ngff-zarr>=0.39",     # OME-Zarr / OME-NGFF 0.5 multiscale group metadata
    "wasmtime<48",         # UPSTREAM WORKAROUND, remove when itkwasm catches up:
                           # ngff-zarr's reader goes through itkwasm, whose 1.0b*
                           # `pipeline.py` imports DirPerms/FilePerms — removed in
                           # wasmtime 48 — while declaring only `wasmtime>=28`. So a
                           # fresh resolve takes 48 and every ngff-zarr read raises
                           # ImportError. Not visible in `neu-env`, which holds 47.0.1.
    "zarr>=3",             # ngff-zarr's array backend; v3 metadata is required
    "jsonschema",          # ngff_zarr.validate() in ngff.validate_attrs — not
                           # optional: convert()/extract_roi() default validate=True
    "h5py",                # HDF5 chunk shards
    "tifffile",            # TIFF (multi-file + multipage) sources
    "imageio",             # PNG / misc 2D image sources
    "blockrun",         # shared dask/SLURM chunked-map substrate
]
# NOT declared, and cannot be:
#   cloud-volume — reads .gz-chunked precomputed (backends/cloudvolume.py). It pins
#     DracoPy<2 and would downgrade the DracoPy behind neu-morpho's mesh
#     serialisation, so it lives in the separate `neu-vol-cv` env.
#   neuclease    — reads DVID labelmaps (backends/dvid.py). Its own dependencies
#     include libdvid-cpp, vigra and dvidutils, all conda-only on flyem-forge, and
#     libdvid is load-bearing rather than incidental: it is what inflates DVID's
#     compressed label blocks. A pip extra would simply fail to install. Get it with
#     `mamba install -n neu-env -c flyem-forge -c conda-forge neuclease`.
# Both backends import cleanly without their library and raise an explanatory
# ImportError only when a volume actually needs one.

[project.scripts]
neu-vol = "neu_vol.cli:main"

[project.optional-dependencies]
# pytest-xdist is opt-in and never in addopts: it pays off for THIS suite only, and
# only at a small worker count. See tests/conftest.py for the measured numbers and
# why `-n auto` is the wrong answer here.
dev = ["pytest", "pytest-xdist"]

[tool.hatch.build.targets.wheel]
packages = ["neu_vol"]
# No package data here: the dask config templates live in blockrun, next to
# start_dask, and are resolved by name through it. Site-specific configs stay out of
# the repo entirely — the top-level configs/ is gitignored.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises a real dask cluster (LocalCluster); slower to run",
]
